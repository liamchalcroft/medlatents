[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medlatents"
version = "0.1.0"
description = "Latent generative models interoperable with medtokenizers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Liam Chalcroft"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "einops>=0.6",
    "accelerate>=0.20",
    "torch-ema>=0.3",
    "wandb>=0.15",
    "medtokenizers>=0.1.0",
    "medrs>=0.2.0",
    "lpips>=0.1",
    "jaxtyping>=0.2.20",
    "beartype>=0.15.0",
    "scipy>=1.7",
    "torchvision>=0.15",
    "nibabel>=4.0",
    "torchmetrics>=1.9.0",
    "torch-fidelity>=0.4.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/liamchalcroft/medlatents"
Documentation = "https://liamchalcroft.github.io/medlatents/"
Repository = "https://github.com/liamchalcroft/medlatents"
Issues = "https://github.com/liamchalcroft/medlatents/issues"
Changelog = "https://github.com/liamchalcroft/medlatents/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]

dev = [
    "medlatents[test]",
    "ruff>=0.4.0",
    "pre-commit>=3.5",
    "setuptools>=64",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-autodoc2>=0.5",
    "sphinxcontrib-mermaid>=0.9",
    "myst-parser>=2.0",
]

all = ["medlatents[dev,docs]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medlatents = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # `zip()` without an explicit `strict=` parameter
    "SIM108", # Use ternary operator (often less readable)
    "SIM102", # Nested if statements (often more readable as-is)
    "F722",   # jaxtyping forward annotations
    "F821",   # jaxtyping dimension names aren't Python variables
    "UP037",  # jaxtyping requires quotes for dimension names
    "ARG001", # unused function argument (interface design)
    "ARG002", # unused method argument (interface design)
    "ARG005", # unused lambda argument (interface design)
    "B007",   # unused loop variable (often intentional)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG002"]  # Unused fixture args are common in pytest
"src/medlatents/__init__.py" = ["E402"]  # Conditional imports before main exports
"src/medlatents/config_models/__init__.py" = ["E402"]  # Conditional imports

[tool.ruff.lint.isort]
known-first-party = ["medlatents"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["medlatents"]
omit = ["*/tests/*", "*/scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
